<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЯТЬ — Проводник</title>
    <style>
        :root {
            --bg-outside: #120a06;
            --bg-inside: #1e130c;
            --card-bg: #2b1d14;
            --gold: #d4af37;
            --text-main: #e0d2bc;
            --text-muted: #856a54;
            --border: #3d2b20;
        }

        body {
            background-color: var(--bg-outside);
            color: var(--text-main);
            font-family: "Times New Roman", Georgia, serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            max-width: 750px;
            width: 100%;
            background-color: var(--bg-inside);
            border: 1px solid var(--border);
            padding: 60px 40px;
            box-shadow: 0 0 80px rgba(0,0,0,0.7);
            position: relative;
            text-align: center;
        }

        /* Та самая тонкая внутренняя рамка со скрина */
        .main-container::before {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid rgba(133, 91, 55, 0.15);
            pointer-events: none;
        }

        .logo-symbol {
            font-size: 80px;
            color: var(--gold);
            line-height: 1;
            margin-bottom: 10px;
            display: block;
        }

        .logo-title {
            text-transform: uppercase;
            letter-spacing: 6px;
            font-size: 32px;
            margin-bottom: 10px;
            display: block;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
            width: 250px;
            margin: 20px auto 40px;
            opacity: 0.4;
        }

        .status-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: 2px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            margin: 20px 0;
        }

        h1 {
            color: var(--gold);
            font-size: 26px;
            font-weight: normal;
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: 1px;
            }

        /* Стиль для ссылок внутри контента */
        .status-box a {
            color: #4a90e2; /* Тот же синий, что у H2 */
            text-decoration: none; /* Убираем стандартное подчеркивание */
            padding-bottom: 2px;
            border-bottom: 1px double rgba(74, 144, 226, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .status-box a:hover {
            color: var(--gold); /* При наведении ссылка станет золотой */
            border-bottom-color: var(--gold);
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

         h2 {
             /* Глубокий синий с легким уходом в сталь, чтобы сочетался с золотом */
             color: #4a90e2; 
             font-size: 26px;
             font-weight: normal;
             text-transform: uppercase;
             letter-spacing: 2px;
             margin: 10px 0 25px 0;
                
             /* Шрифт с засечками для стиля "Ять" */
             font-family: "Times New Roman", Georgia, serif;
             }

        p {
            line-height: 1.8;
            font-size: 19px;
            margin: 0;
        }

        .footer {
            margin-top: 50px;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Приглушенные ссылки */
        .footer a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid rgba(133, 106, 84, 0.3);
            transition: all 0.3s ease;
        }

        .footer a:hover {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }

        /* Декоративный элемент в углу, как на фото */
        .corner-decor {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            opacity: 0.5;
        }
    </style>
</head>
